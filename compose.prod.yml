services:
  db:
    image: postgres:16
    container_name: suksuk_growth_record_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SUKSUK_SCHOOL_DATABASE_NAME:-suksuk_growth_record_production}
      POSTGRES_USER: ${SUKSUK_SCHOOL_DATABASE_USER:-suksuk_growth_record}
      POSTGRES_PASSWORD: ${SUKSUK_SCHOOL_DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SUKSUK_SCHOOL_DATABASE_USER:-suksuk_growth_record} -d ${SUKSUK_SCHOOL_DATABASE_NAME:-suksuk_growth_record_production}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: ghcr.io/shinjaehun/suksuk_growth_record:latest
    container_name: suksuk_growth_record_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      FORCE_SSL: ${FORCE_SSL:-true}
      RAILS_LOG_LEVEL: ${RAILS_LOG_LEVEL:-info}
      RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-3}
      RAILS_MIN_THREADS: ${RAILS_MIN_THREADS:-3}
      PORT: 3000
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      SUKSUK_SCHOOL_DATABASE_NAME: ${SUKSUK_SCHOOL_DATABASE_NAME:-suksuk_growth_record_production}
      SUKSUK_SCHOOL_DATABASE_USER: ${SUKSUK_SCHOOL_DATABASE_USER:-suksuk_growth_record}
      SUKSUK_SCHOOL_DATABASE_PASSWORD: ${SUKSUK_SCHOOL_DATABASE_PASSWORD}
      SUKSUK_SCHOOL_DATABASE_HOST: ${SUKSUK_SCHOOL_DATABASE_HOST:-db}
      SUKSUK_SCHOOL_DATABASE_PORT: ${SUKSUK_SCHOOL_DATABASE_PORT:-5432}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    command: ["bundle", "exec", "puma", "-C", "config/puma.rb"]
    volumes:
      - active_storage:/rails/storage

volumes:
  postgres_data:
  active_storage:
